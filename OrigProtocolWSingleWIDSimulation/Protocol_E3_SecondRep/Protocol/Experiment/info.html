<!DOCTYPE html>
<html>
<head>
    <script src="jatos.js"></script>
    <script src="jspsych/jspsych.js"></script>
    <script src="jspsych/plugin-survey-html-form.js"></script>
    <link href="jspsych/jspsych.css" rel="stylesheet" type="text/css" />  
  </head>
<body></body>
<script>    

    var subject_id;
    var study_id;
    var session_id;    
    var consent_approved = 0;

    const jsPsych = initJsPsych({        
        on_finish: function(){           
            //Puts data as csv on Jatos 
            resultCSV = jsPsych.data.get().csv(); 
            jatos.submitResultData(resultCSV, jatos.startNextComponent);                   
        }
    })

    function setup(){
        // Capture info from Prolific
        var params = jatos.urlQueryParameters
        subject_id = jatos.urlQueryParameters.PROLIFIC_PID;
        study_id = jatos.urlQueryParameters.STUDY_ID;
        session_id = jatos.urlQueryParameters.SESSION_ID;        
    }


    //Html form with checkbox to allow participant to give consent to partaking
    const instruction = {
        type: jsPsychSurveyHtmlForm,
        preamble: `
        <p class = 'instructions'>Thank you for choosing to participate in this study. We will show you images on the screen and ask you to respond to questions about what you see. Please read below for information about the study, we will provide more specific instructions in following pages.</p>
        <div class = 'information'>
            <p>This study has been approved by the Research Department of Experimental Psychology Ethics Chair, with project ID number: EP_2024_002.</p>
            <p>Principal investigator: Clare Press, PhD;	Co-investigator: Nick Simpson.<br>
            Address: Department of Experimental Psychology,<br>
            University College London,<br>
            26 Bedford Way,<br>
            London WC1H 0AP<br>
            Contact email: nicholas.simpson.23@ucl.ac.uk</p>
            <p>Please take time to read the following information about this study carefully and discuss it with others if you wish. Feel free to ask the researcher any questions you may have before agreeing to participate. Take the time to decide whether or not you wish to take part.</p>
            <ol>
                <li>What is the study's purpose?</li>
                <ul style="list-style-type:none;">
                    <li>We are investigating how people perceive the world in different kinds of contexts. In this task you will see moving objects on the screen. We will ask you about the motion of the objects by asking about the location, speed, or acceleration. We expect that this task will take 30 minutes. Before the task you will be given clear instructions about what you are expected to do.</li>
                </ul>
                <li>Why have I been chosen?</li>
                <ul style="list-style-type:none;">
                    <li>You have been chosen because you are aged 18-60 and your first language is English. Please let the researcher know if this is not the case.</li>
                </ul>
                <li>Do I have to take part?</li>
                <ul style="list-style-type:none;">
                    <li>It is up to you to decide whether or not to take part. You can withdraw at any time, without giving a reason by simply closing the window or returning the study. If you decide to withdraw and you wish for your data to be deleted, please contact us via email.</li>
                </ul>
                <li>What are the possible benefits of taking part?</li>
                <ul style="list-style-type:none;">
                    <li>Whilst there are no immediate benefits for those people participating in the study, this work will help us to learn more about how people are able to perceive the world around them.</li>
                </ul>
                <li>What if something goes wrong?</li>
                <ul style="list-style-type:none;">
                    <li>If you are unhappy about any aspect of the study, or wish to inform us of any negative experiences related to the study then you may contact the lead researcher (Prof Clare Press, c.press@ucl.ac.uk), co-researcher (Nick Simpson, nicholas.simpson.23@ucl.ac.uk), or the Chair of the UCL Research Ethics Committee (ethics@ucl.ac.uk).</li>
                </ul>
                <li>Will my taking part in this study be kept confidential?</li>
                <ul style="list-style-type:none;">
                    <li>All the information that we collect about you during the course of the study will be kept strictly confidential. You will not be identifiable in any ensuing reports or publications. Anonymised versions of your data may be shared with other scientists. Please ask the researcher if you have any concerns about confidentiality.</li>
                </ul>
                <li>Limits to confidentiality.</li>
                <ul style="list-style-type:none;">
                    <li>Confidentiality will be respected unless there are compelling and legitimate reasons for this to be breached. If this was the case, we would inform you of any decisions that might limit your confidentiality.</li>
                </ul>
                <li>Data Protection Privacy Notice.</li>
                <ul style="list-style-type:none;">
                    <li>The data controller for this project will be University College London (UCL). The UCL Data Protection Office provides oversight of UCL activities involving the processing of personal data, and can be contacted at data-protection@ucl.ac.uk. Your personal data will be processed for the purposes outlined in this notice. The legal basis that would be used to process your personal data will be performance of a task in the public interest.</li>
                    <li>Your personal data will be processed so long as it is required for the research project. If we are able to anonymise or pseudonymise the personal data you provide we will undertake this, and will endeavour to minimise the processing of personal data wherever possible.</li>
                    <li>This 'local' privacy notice sets out the information that applies to this particular study. Further information on how UCL uses participant information can be found in our 'general' privacy notice: <a href="https://www.ucl.ac.uk/legal-services/privacy/ucl-general-research-participant-privacy-notice" target="_blank">https://www.ucl.ac.uk/legal-services/privacy/ucl-general-research-participant-privacy-notice</a>. The information that is required to be provided to participants under data protection legislation (GDPR and DPA 2018) is provided across both the 'local' and 'general' privacy notices.</li>
                    <li>If you are concerned about how your personal data is being processed, please contact UCL at data-protection@ucl.ac.uk. If you remain unsatisfied, you may wish to contact the Information Commissioner's Office (ICO). Contact details, and details of data subject rights, are available on the ICO website at: <a href="https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/individual-rights/" target="_blank">https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/individual-rights/</a></li>
                </ul>
                <li>Contact for further information.</li>
                <ul style="list-style-type:none;">
                    <li>Please contact Nick Simpson (nicholas.simpson.23@ucl.ac.uk) if you require any further information about this research.</li>
                </ul>
            </ol>
            <p>Please press confirm to acknowledge that you have read and understood the above information.</p>
        </div>
        `,
        html: `<input type="checkbox" id="consent" name="consent">
        <label for="consent"> I have read and agreed to the above information.</label><br>`,
        data: {
            test_type: 'instruction_sheet',                
        },          
        //Once continue is pressed, the consent variable can be changed to 1 if the response is on (box checked)
        on_finish: function(data){
            data.subject_id = subject_id;
            data.study_id = study_id;
            data.session_id = session_id;  
            if(data.response.consent=="on"){
                consent_approved = 1;
                //Response is checked but data correct being true is another way we can confirm the box was ticked
                data.correct = true;                           
            }            
        }    
    }

    //This forms a loop such that we won't leave the consent page until the box has been checked at the time of pressing continue
    var instruction_procedure = {
        timeline: [instruction],
        loop_function: function(data){            
            if (!consent_approved){
                return true
            } else {
                return false
            }
        }        
    }

    //Put it all into an experiment
    jatos.onLoad(() => {
        setup();  
        jatos.addAbortButton();
        jsPsych.run([instruction_procedure]);
    });        

</script>

</html>
